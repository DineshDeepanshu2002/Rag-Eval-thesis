# =====================================================================
# RAG Evaluation Thesis — Experiment Matrix
# 2 chunking × 3 retrieval × 2 rerank = 12 configurations
# Run on 2 datasets × evaluated by 3 frameworks = 72 evaluation runs
# (Scope reduced from 108 per supervisor feedback: sliding-window
#  chunking dropped; retrieval kept as the primary dimension of interest.)
# =====================================================================

seed: 42                      # fixed everywhere for reproducibility

datasets:
  - name: msmarco
    hf_id: "BeIR/msmarco"     # BEIR-formatted MS MARCO passage
    split: dev
    n_queries: 500            # sampled subset (fixed seed) — full dev is too costly
    max_corpus: 50000         # pooled corpus cap: relevant docs + seeded distractors
  - name: nq
    hf_id: "BeIR/nq"
    split: test
    n_queries: 500
    max_corpus: 50000         # same cap on both datasets keeps comparisons fair

chunking:
  - name: fixed
    params: { chunk_size: 256, overlap: 0 }          # tokens
  - name: semantic
    params: { max_chunk_size: 384, similarity_threshold: 0.55,
              embed_model: "sentence-transformers/all-MiniLM-L6-v2" }

retrieval:
  - name: bm25
    params: { k1: 0.9, b: 0.4 }
  - name: dense
    params: { model: "sentence-transformers/all-mpnet-base-v2", top_k: 100 }
  - name: hybrid
    params: { fusion: rrf, rrf_k: 60 }               # reciprocal rank fusion of bm25+dense

rerank:
  - name: none
    params: {}
  - name: cross_encoder
    params: { model: "cross-encoder/ms-marco-MiniLM-L-6-v2", top_k_in: 50 }

generation:
  model: gpt-4o-mini  # budget model — stated as limitation in methodology
  temperature: 0.0
  max_tokens: 512
  top_k_context: 5               # passages fed to the generator

evaluation:
  ir:
    k_values: [1, 3, 5, 10]   # Precision@k; MRR and nDCG@10 always computed
  ragas:
    metrics: [faithfulness, answer_relevancy, context_relevancy]
    judge_model: gpt-4o-mini
  ares:
    judge_model: gpt-4o-mini
    n_calibration: 200        # human-labelled points for PPI calibration
    confidence: 0.95

stats:
  bootstrap_iters: 10000
  alpha: 0.05

tracking:
  wandb_project: rag-eval-thesis
  results_dir: results/
